<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro para Mariana</title>

<style>
body {
    margin: 0;
    background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794') no-repeat center center/cover;
    font-family: "Georgia", serif;
    overflow: hidden;
}

#book {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.page {
    background: rgba(20,20,30,0.9);
    padding: 40px;
    max-width: 700px;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    color: #eaeaf0;
    line-height: 1.6;
    animation: fadeIn 0.8s ease forwards;
}

h1 {
    text-align: center;
    font-weight: normal;
    letter-spacing: 2px;
}

button {
    margin-top: 30px;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #aaa;
    color: #fff;
    cursor: pointer;
    display: none;
}

.strike {
    text-decoration: line-through;
    color: #ff6b6b;
}

.glitch {
    animation: glitch 0.3s;
}

@keyframes glitch {
    0% { transform: translate(2px, -2px); }
    50% { transform: translate(-2px, 2px); }
    100% { transform: translate(0,0); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div id="book"></div>

<script>

const pages = [

`<div class="page">
<h1>...</h1>
<p id="type"></p>
<button onclick="nextPage()">Continuar</button>
</div>`,

`<div class="page">
<h1>Capítulo 1</h1>
<p id="c1"></p>
<button onclick="nextPage()">Continuar</button>
</div>`,

`<div class="page">
<h1>Capítulo 2</h1>
<p id="c2"></p>
<button onclick="nextPage()">Continuar</button>
</div>`,

`<div class="page">
<h1>Capítulo 3</h1>
<p id="c3"></p>
<button onclick="nextPage()">Continuar</button>
</div>`,

`<div class="page">
<h1>Capítulo 4</h1>
<p id="c4"></p>
<button onclick="nextPage()">Continuar</button>
</div>`,

`<div class="page">
<h1>Capítulo 5</h1>
<p id="c5"></p>
<button onclick="nextPage()">Continuar</button>
</div>`,

`<div class="page">
<h1>Final</h1>
<p id="finalText"></p>
</div>`

];

const rawTexts = [

`Mentiría si te dijera que esta es la primera vez que hago algo así,
o bueno… no sé si eso importa.

pero también si dijera que lo hago siempre y con cualquiera…
aunque tal vez sí lo parece.

Aunque no lo demuestre, eres alguien especial,
creo… supongo.

Y te veo como a un ser humano más allá de mí mismo,
o eso intento.`,

`Mariana, no te conozco lo suficiente para describirte,
ni sé si debería intentarlo.

No me tomo el tiempo de ver tus sentidos,
o tal vez no sé cómo hacerlo.

Pero sí me tomo el tiempo de pasar tiempo contigo,
y eso… creo que significa algo.

Y eso es lo más cercano que tengo a algo genuino,
aunque no estoy seguro.`,

`Te quiero y te aprecio por eso,
o eso creo.

Perdón por ser áspero a veces.
Por no saber apreciarte.
Por intentar encapsularte,
aunque ni yo entiendo por qué.`,

`El amor no se pide,
o eso dicen.

Todo ser humano merece ser amado solo por ser quien es,
aunque a veces no lo parezca.

Deja de intentar ser las sombras de alguien,
aunque yo también lo hago.`,

`Este libro lo escogí por dos razones:

1. Es de los pocos que conozco
2. Creo que todo lector quiere que lo que lee sea real,
   o al menos sentirlo así

Espero que siga alimentando tu vicio,
aunque no sé si esto sirva.`

];

const cleanTexts = [

`Mentiría si te dijera que esta es la primera vez que hago algo así,
pero también si dijera que lo hago siempre y con cualquiera.

Aunque no lo demuestre, eres alguien especial.

Y te veo como a un ser humano más allá de mí mismo.`,

`Mariana, no te conozco lo suficiente para describirte.

No me tomo el tiempo de ver tus sentidos.

Pero sí me tomo el tiempo de pasar tiempo contigo.

Y eso es lo más cercano que tengo a algo genuino.`,

`Te quiero y te aprecio por eso.

Perdón por ser áspero a veces.
Por no saber apreciarte.
Por intentar encapsularte.`,

`El amor no se pide.

Todo ser humano merece ser amado solo por ser quien es.

Deja de intentar ser las sombras de alguien.`,

`Este libro lo escogí por dos razones:

1. Es de los pocos que conozco
2. Creo que todo lector quiere que lo que lee sea real

Espero que siga alimentando tu vicio.`

];

const finalMessage = `
Gracias por ser mi amiga 
Gracias por las peleas y por las cosas ajenas 
Gracias porque me haz querido y apreciado 
Por verme
`;

let currentPage = 0;
const book = document.getElementById("book");

function renderPage() {
    book.innerHTML = pages[currentPage];

    setTimeout(() => {
        if(currentPage > 0 && currentPage <= rawTexts.length){
            startEffect(currentPage);
        }

        if(currentPage === pages.length - 1){
            document.getElementById("finalText").innerText = finalMessage;
        }

        if(currentPage === 0){
            i = 0;
            typeWriter();
        }
    }, 50);
}

function nextPage() {
    if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
    }
}

function startEffect(cap) {
    let element = document.getElementById("c"+cap);
    if(!element) return;

    let raw = rawTexts[cap-1];
    let clean = cleanTexts[cap-1];

    element.innerHTML = "";

    let i = 0;
    let btn = element.parentElement.querySelector("button");
    if(btn) btn.style.display = "none";

    function writeAndStrike() {

        if (i < raw.length) {

            let char = raw[i];

            let span = document.createElement("span");
            span.innerText = char;
            element.appendChild(span);

            let noStrike = Math.random() < 0.12;

            if(!noStrike && char !== " " && char !== "\n"){
                setTimeout(() => {
                    span.classList.add("strike");
                }, 200 + Math.random()*300);
            }

            i++;

            let delay = 25;
            if(char === "." || char === "," || char === "\n") delay = 120;
            if(char === "…") delay = 200;

            setTimeout(writeAndStrike, delay);

        } else {

            setTimeout(() => {

                element.classList.add("glitch");
                setTimeout(()=>element.classList.remove("glitch"),300);

                element.innerHTML = "";
                typeCleanText(element, clean, btn);

            }, 5000);
        }
    }

    writeAndStrike();
}

function typeCleanText(element, text, btn){

    let i = 0;

    function write(){

        if(i < text.length){

            let char = text.charAt(i);
            element.innerHTML += char;
            i++;

            let delay = 25;
            if(char === "." || char === "," || char === "\n") delay = 100;

            setTimeout(write, delay);

        } else {
            if(btn) btn.style.display = "block";
        }
    }

    write();
}

const intro = "Dicen que los libros cuentan historias...\npero este parece haber encontrado a su protagonista.\n\nMariana.";
let i = 0;

function typeWriter() {
    let el = document.getElementById("type");
    let btn = document.querySelector("button");

    if (el && i < intro.length) {
        el.innerHTML += intro.charAt(i);
        i++;

        let delay = (intro.charAt(i) === "." || intro.charAt(i) === "\n") ? 120 : 40;

        setTimeout(typeWriter, delay);

    } else if(btn) {
        btn.style.display = "block";
    }
}

renderPage();

let buffer = "";

document.addEventListener("keydown", (e) => {
    buffer += e.key.toLowerCase();

    if (buffer.includes("mariana")) {
        document.body.style.background = "black";
        alert("ya estabas aquí desde el inicio");
        buffer = "";
    }

    if (buffer.includes("andrea")) {
        alert("no todo lo que se escribe se olvida");
        buffer = "";
    }
});

</script>

</body>
</html>
